# A SoulStone test world: Paper behind Docker, as the lab runs it on a Raspberry Pi 4.
# Copy beside a private .env that sets RCON_PASSWORD and SEED; never commit it. The server
# reads both from there (env_file), so no secret is written in this file.
# Only the game port is published, so RCON stays inside the container: the staging
# scripts reach it with `docker exec <container> rcon-cli`.
services:
  mc-sandbox:
    image: itzg/minecraft-server:java25
    container_name: mc-sandbox
    restart: unless-stopped
    stop_grace_period: 1m
    tty: true
    stdin_open: true
    env_file: .env
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      # A version harness/bridge/compatibility.json pins a route for (26.2, 26.3).
      VERSION: "26.2"
      # A Pi 4 with 4 GB holds the server, the bot and the bridge at this heap.
      INIT_MEMORY: "1G"
      MAX_MEMORY: "1800M"
      MODE: "survival"
      DIFFICULTY: "easy"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "5"
      ALLOW_FLIGHT: "TRUE"
      MAX_TICK_TIME: "180000"
      ENABLE_RCON: "TRUE"
      BROADCAST_RCON_TO_OPS: "FALSE"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      # Lets a newer client join to watch.
      MODRINTH_PROJECTS: "viaversion,viabackwards"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 30s
      timeout: 10s
      retries: 5
